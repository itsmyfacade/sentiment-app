services:
  - type: web
    name: sentiment-lab-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MODEL_NAME
        value: distilbert-base-uncased-finetuned-sst-2-english
      - key: MAX_CONTENT_LENGTH
        value: "20000"
      - key: INFERENCE_CONCURRENCY
        value: "1"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"

  - type: web
    name: sentiment-lab-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: API_URL
        sync: false
